version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    pre_install:
      - python -m pip install "sphinx>=7,<7.3" "myst-nb>=1.1,<1.2" "myst-parser>=2,<3"
    post_install:
      # Install the latest tricor from GitHub main branch for autodoc
      - python -m pip install git+https://github.com/ophusgroup/tricor.git@main

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
