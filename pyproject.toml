[project]
name = "tricor-docs"
version = "0.1.0"
description = "Documentation and pre-rendered figures for tricor"
requires-python = ">=3.10"
dependencies = [
    "tricor",
    "sphinx>=7,<7.3",
    "furo",
    "myst-nb>=1.1,<1.2",
    "myst-parser>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
